name: Daily Quote Post - Thursday 9:00 AM IST

on:
  schedule:
    - cron: '30 3 * * 4'  # 03:30 UTC = Thursday 9:00 AM IST
  workflow_dispatch:        # Manual trigger for testing

jobs:
  post-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Composio CLI
        run: |
          curl -fsSL https://composio.dev/install | bash -s -- @composio/cli@0.2.32
          # Add composio binary dir to PATH (location varies by platform)
          COMPOSIO_DIR="$(dirname $(find $HOME/.composio -name composio -type f 2>/dev/null | head -1))"
          if [ -n "$COMPOSIO_DIR" ]; then
            echo "$COMPOSIO_DIR" >> $GITHUB_PATH
          else
            echo "composio binary not found after install" >&2
            exit 1
          fi

      - name: Authenticate Composio
        run: composio login -y --user-api-key "${{ secrets.COMPOSIO_API_KEY }}"

      - name: Post Quote
        env:
          SLOT_ID: '5'
          BRAND: 'success.for.sure™'
          CATEGORIES: 'business,entrepreneurship,leadership,success,motivation'
          HASHTAGS: '#motivatemedaily,#inspire,#inspiremedaily,#motivate,#hustle,#hardwork'
          LOCATIONS: '#gurgaon,#delhidiaries'
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: composio run --file scripts/post-workflow.ts
