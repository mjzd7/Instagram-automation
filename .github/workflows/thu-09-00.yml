name: Daily Quote Post - Thursday 9:00 AM IST

on:
  schedule:
    - cron: '30 3 * * 4'  # 03:30 UTC = Thursday 9:00 AM IST
  workflow_dispatch:        # Manual trigger for testing

jobs:
  post-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Composio CLI
        run: curl -fsSL https://composio.dev/install.sh | bash
      
- name: Post Quote
         env:
           SLOT_ID: '5'
           BRAND: 'success.for.sure™'
           CATEGORIES: 'business,entrepreneurship,leadership,success,motivation'
           HASHTAGS: '#motivatemedaily,#inspire,#inspiremedaily,#motivate,#hustle,#hardwork'
           LOCATIONS: '#gurgaon,#delhidiaries'
           COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
         run: composio run --file scripts/daily-quote.ts
