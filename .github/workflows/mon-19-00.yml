name: Daily Quote Post - Monday 7:00 PM IST

on:
  schedule:
    - cron: '30 13 * * 1'  # 13:30 UTC = Monday 7:00 PM IST
  workflow_dispatch:        # Manual trigger for testing

jobs:
  post-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Composio CLI
        run: npm install -g composio

      - name: Authenticate Composio
        run: npx composio login -y --user-api-key "${{ secrets.COMPOSIO_API_KEY }}"

      - name: Post Quote
        env:
          SLOT_ID: '1'
          BRAND: 'success.for.sure™'
          CATEGORIES: 'business,entrepreneurship,leadership,success,motivation'
          HASHTAGS: '#motivatemedaily,#inspire,#inspiremedaily,#motivate,#hustle,#hardwork'
          LOCATIONS: '#gurgaon,#delhidiaries'
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: npx composio run --file scripts/post-workflow.ts
